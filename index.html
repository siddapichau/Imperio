<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b2a">
  <meta name="description" content="Aplicativo da Igreja Imperial Batista: cultos, células, presença, notícias e comunhão.">
  <title>Igreja Imperial Batista</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
  <a class="skip-link" href="#appFrame">Ir para o conteúdo</a>

  <header class="topbar" id="topbar">
    <button class="icon-button mobile-only" id="openDrawer" aria-label="Abrir menu">☰</button>
    <a class="brand" href="#home" aria-label="Início">
      <img id="brandLogo" src="assets/logo.png" alt="Logo Igreja Imperial Batista">
      <span>
        <strong id="brandName">Igreja Imperial Batista</strong>
        <small id="brandSlogan">Servir, amar e discipular</small>
      </span>
    </a>

    <nav class="desktop-nav" id="desktopNav" aria-label="Menu principal"></nav>

    <div class="top-actions">
      <button class="chip" id="themeToggle" type="button" title="Alternar tema">🌙</button>
      <button class="chip" id="installBtn" type="button" hidden>Instalar</button>
      <button class="profile-chip" id="loginOpen" type="button">Entrar</button>
    </div>
  </header>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-panel" role="dialog" aria-label="Menu lateral">
      <div class="drawer-head">
        <img src="assets/logo.png" alt="">
        <div>
          <strong id="drawerTitle">Imperial Batista</strong>
          <small>Menu do aplicativo</small>
        </div>
        <button class="icon-button" id="closeDrawer" aria-label="Fechar menu">×</button>
      </div>
      <nav id="mobileNav" class="mobile-nav"></nav>
      <a class="drawer-admin" href="admin.html">⚙️ Administração</a>
    </div>
  </aside>

  <main class="frame-wrap">
    <iframe id="appFrame" title="Conteúdo do aplicativo" src="pages/home.html" loading="eager"></iframe>
  </main>

  <dialog class="modal" id="authModal">
    <form method="dialog" class="modal-card" id="authForm">
      <button class="modal-close" value="cancel" aria-label="Fechar">×</button>
      <img src="assets/logo.png" alt="" class="modal-logo">
      <h2>Entrar no aplicativo</h2>
      <p class="muted">Acesse seu perfil, presença, células e quizzes.</p>

      <label>Email
        <input id="authEmail" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
      </label>
      <label>Senha
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="Sua senha" required>
      </label>
      <label class="register-only" hidden>Nome completo
        <input id="authName" type="text" autocomplete="name" placeholder="Seu nome">
      </label>

      <div class="row gap wrap">
        <button class="btn primary" id="emailLogin" type="submit">Entrar</button>
        <button class="btn ghost" id="registerToggle" type="button">Criar conta</button>
      </div>
      <button class="btn google" id="googleLogin" type="button">Entrar com Google</button>
      <p class="help-text" id="authHelp">Demo local: pastor@imperialbatista.local / imperio123</p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
