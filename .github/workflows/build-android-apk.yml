name: Build Android APK
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - arena/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependências
        run: npm ci
      - name: Validar configuração do APK para Firebase Auth
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          const host = cfg.server && cfg.server.hostname;
          const scheme = cfg.server && cfg.server.androidScheme;
          if (scheme !== 'https') throw new Error('server.androidScheme precisa ser https para Firebase Auth no APK.');
          if (host !== 'localhost') {
            throw new Error(`server.hostname precisa ser localhost no APK. Host atual: ${host || '(vazio)'}.`);
          }
          console.log(`✅ APK será gerado em origem segura: ${scheme}://${host}`);
          console.log('✅ Essa origem evita quebra de login Email/Senha e Google por domínio não autorizado no Firebase.');
          NODE
      - name: Preparar web/Android do Capacitor
        run: npm run android:prepare
      - name: Gerar APK debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Separar APK para download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/Igreja-Imperial-Batista.apk"
          ls -lh artifacts
      - name: Publicar APK nos artifacts do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Igreja-Imperial-Batista
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
