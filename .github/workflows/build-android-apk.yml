
name: Build Android APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - arena/019f9c23-imperio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar APK com logo roxa vinho
        run: npm run android:build:debug

      - name: Separar APK para download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/Igreja-Imperial-Batista-roxo-vinho-debug.apk"
          ls -lh artifacts

      - name: Publicar APK nos artifacts do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Igreja-Imperial-Batista-APK-roxo-vinho
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
